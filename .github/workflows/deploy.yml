name: Deploy to Azure App Service

on:
  push:
    branches: [main]
  workflow_dispatch:

# Secure, credential-free auth to Azure via OpenID Connect (federated identity).
# Required GitHub secrets (no passwords/publish profiles stored in the repo):
#   AZURE_CLIENT_ID        - app registration (federated credential) client id
#   AZURE_TENANT_ID        - directory (tenant) id
#   AZURE_SUBSCRIPTION_ID  - subscription id
#   AZURE_WEBAPP_NAME      - the App Service name
#   DATABASE_URL           - Azure SQL connection string (for migrations)
#   NEXTAUTH_SECRET        - NextAuth secret (build-time)

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, migrate & deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_RESOURCE_GROUP: rg-violetx
      AZURE_SQL_SERVER: violetx-sql-v6s4btstixeoe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Azure SQL only allows Azure services + explicit IPs. Open the runner's
      # public IP just for the migration, then always remove it.
      - name: Open SQL firewall for runner
        run: |
          set -e
          RUNNER_IP=$(curl -s https://api.ipify.org)
          echo "Runner IP: $RUNNER_IP"
          az sql server firewall-rule create -g "$AZURE_RESOURCE_GROUP" -s "$AZURE_SQL_SERVER" -n "gh-runner-${{ github.run_id }}" --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" -o none

      - name: Apply database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Close SQL firewall for runner
        if: always()
        run: az sql server firewall-rule delete -g "$AZURE_RESOURCE_GROUP" -s "$AZURE_SQL_SERVER" -n "gh-runner-${{ github.run_id }}" -o none || true

      - name: Build (standalone)
        run: npm run build
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

      - name: Assemble deployment package
        run: |
          set -e
          rm -rf deploy
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          if [ -d public ]; then cp -r public deploy/public; fi
          cp -r prisma deploy/prisma
          mkdir -p deploy/node_modules
          if [ -d node_modules/.prisma ]; then cp -r node_modules/.prisma deploy/node_modules/.prisma; fi

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: deploy

      - name: Azure logout
        if: always()
        run: az logout

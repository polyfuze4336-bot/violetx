name: Bootstrap owner account

# One-off, manual. Creates the OWNER login only if no OWNER exists yet — an
# existing account is never modified. The password comes from the
# OWNER_PASSWORD repository secret and is never printed.
#
# Required secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
# DATABASE_URL, OWNER_PASSWORD (min 12 chars).

on:
  workflow_dispatch:
    inputs:
      owner_email:
        description: Owner sign-in email (must match the app's OWNER_EMAIL setting)
        required: true
        default: athlete@example.com

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    name: Create owner if missing
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_RESOURCE_GROUP: rg-violetx
      AZURE_SQL_SERVER: violetx-sql-v6s4btstixeoe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open SQL firewall for runner
        run: |
          set -e
          RUNNER_IP=$(curl -s https://api.ipify.org)
          az sql server firewall-rule create -g "$AZURE_RESOURCE_GROUP" -s "$AZURE_SQL_SERVER" -n "gh-runner-${{ github.run_id }}" --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" -o none

      - name: Check for an existing owner
        id: check
        run: echo "state=$(npx tsx scripts/has-owner.ts | tail -n 1)" >> "$GITHUB_OUTPUT"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Create owner (only if none exists)
        if: steps.check.outputs.state == 'NO_OWNER'
        run: npx prisma db seed
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          OWNER_EMAIL: ${{ inputs.owner_email }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}

      - name: Summary
        run: |
          if [ "${{ steps.check.outputs.state }}" = "NO_OWNER" ]; then
            echo "Owner account created for ${{ inputs.owner_email }}."
          else
            echo "An owner account already exists — nothing was changed."
          fi

      - name: Close SQL firewall for runner
        if: always()
        run: az sql server firewall-rule delete -g "$AZURE_RESOURCE_GROUP" -s "$AZURE_SQL_SERVER" -n "gh-runner-${{ github.run_id }}" -o none || true

      - name: Azure logout
        if: always()
        run: az logout || true

name: Reset owner password

# Manual. Sets the OWNER password from the OWNER_PASSWORD secret.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_RESOURCE_GROUP: rg-violetx
      AZURE_SQL_SERVER: violetx-sql-v6s4btstixeoe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open SQL firewall for runner
        run: |
          set -e
          RUNNER_IP=$(curl -s https://api.ipify.org)
          az sql server firewall-rule create -g "$AZURE_RESOURCE_GROUP" -s "$AZURE_SQL_SERVER" -n "gh-runner-${{ github.run_id }}" --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" -o none

      - name: Reset owner password
        run: npx tsx scripts/reset-owner-password.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}

      - name: Close SQL firewall for runner
        if: always()
        run: az sql server firewall-rule delete -g "$AZURE_RESOURCE_GROUP" -s "$AZURE_SQL_SERVER" -n "gh-runner-${{ github.run_id }}" -o none || true

      - name: Azure logout
        if: always()
        run: az logout || true

name: Diagnose (temporary)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      RG: rg-violetx
      SQL: violetx-sql-v6s4btstixeoe
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Download and scan logs
        run: |
          az webapp log download -g "$RG" -n "${{ secrets.AZURE_WEBAPP_NAME }}" --log-file logs.zip -o none || true
          unzip -o -q logs.zip -d logs || true
          f=$(ls logs/LogFiles/2026_10_08_*_default_docker.log | head -1)
          echo "== TLS errors with times"
          grep -n -E 'TLS|P1011|code: ' "$f" | cut -c1-200 | head -60
          echo "== full TLS stack sample"
          L=$(grep -n -m1 'TLS' "$f" | cut -d: -f1); sed -n "$((L-6)),$((L+6))p" "$f" | cut -c1-400
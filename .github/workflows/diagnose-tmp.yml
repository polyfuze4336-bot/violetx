name: Diagnose (temporary)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      RG: rg-violetx
      SQL: violetx-sql-v6s4btstixeoe
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: SQL server / db / firewall
        run: |
          az sql db list -g "$RG" -s "$SQL" --query "[].{n:name,status:status,sku:currentSku.name,pause:autoPauseDelay,free:useFreeLimit,exhaust:freeLimitExhaustionBehavior}" -o table
          az sql server firewall-rule list -g "$RG" -s "$SQL" -o table
          az sql server show -g "$RG" -n "$SQL" --query "{pna:publicNetworkAccess}" -o json
      - name: Web app
        run: |
          az webapp show -g "$RG" -n "${{ secrets.AZURE_WEBAPP_NAME }}" --query "{state:state,outbound:outboundIpAddresses,possible:possibleOutboundIpAddresses}" -o json
          az webapp config appsettings list -g "$RG" -n "${{ secrets.AZURE_WEBAPP_NAME }}" --query "[].name" -o tsv
      - name: Recent app logs
        run: |
          az webapp log download -g "$RG" -n "${{ secrets.AZURE_WEBAPP_NAME }}" --log-file logs.zip -o none || true
          unzip -o -q logs.zip -d logs || true
          ls -R logs | head -30
          for f in $(find logs -name '*default_docker.log' | head -2); do echo "== $f"; tail -60 "$f" | cut -c1-300; done

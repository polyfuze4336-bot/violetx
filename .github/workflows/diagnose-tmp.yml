name: Diagnose (temporary)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    env:
      RG: rg-violetx
      SQL: violetx-sql-v6s4btstixeoe
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Download and scan logs
        run: |
          az webapp log download -g "$RG" -n "${{ secrets.AZURE_WEBAPP_NAME }}" --log-file logs.zip -o none || true
          unzip -o -q logs.zip -d logs || true
          for f in logs/LogFiles/2026_10_08_*_default_docker.log; do
            echo "== $f $(wc -l < $f) lines"
            grep -n -m1 -E 'prisma:error|Error' "$f" | cut -c1-250
            echo "-- error kinds"
            grep -E 'code: |Error' "$f" | sed -E 's/^[0-9T:.Z-]+ //' | cut -c1-120 | sort | uniq -c | sort -rn | head -12
            echo "-- first 40 lines around first error"
            L=$(grep -n -m1 -E 'prisma:error' "$f" | cut -d: -f1); [ -n "$L" ] && sed -n "$((L>10?L-10:1)),$((L+30))p" "$f" | cut -c1-260
          done
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, type-check, test & build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # A dummy connection string so `next build` can load config that
          # references DATABASE_URL. No database is contacted during build.
          DATABASE_URL: "sqlserver://localhost:1433;database=ci;user=sa;password=Build_only_123;encrypt=true;trustServerCertificate=true"
          NEXTAUTH_SECRET: "ci-build-secret"

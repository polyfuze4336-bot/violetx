name: Diagnose (temporary)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Recent exceptions
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt extension.dynamic_install_allow_preview=true >/dev/null
          q() { az monitor app-insights query -g rg-violetx --app violetx-ai --offset 6h --analytics-query "$1" -o tsv 2>/dev/null || true; }
          echo "== POST requests"; q "requests | where name startswith 'POST' | order by timestamp desc | take 25 | project timestamp, name, resultCode, duration"
          echo "== failed dependencies"; q "dependencies | where success == false | order by timestamp desc | take 15 | project timestamp, type, name=substring(name,0,80), resultCode, duration"
          echo "== exceptions"; q "exceptions | order by timestamp desc | take 10 | project timestamp, type, msg=substring(replace_string(outerMessage,'\n',' '),0,500)"
          echo "== traces"; q "traces | where severityLevel >= 3 | order by timestamp desc | take 10 | project timestamp, msg=substring(replace_string(message,'\n',' '),0,500)"
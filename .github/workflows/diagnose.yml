name: Diagnose (temporary)

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: App logs
        env:
          WEBAPP: ${{ secrets.AZURE_WEBAPP_NAME }}
        run: |
          az webapp log download -g rg-violetx -n "$WEBAPP" --log-file logs.zip >/dev/null 2>&1 || echo "download failed"
          mkdir -p logs && unzip -oq logs.zip -d logs || true
          find logs -type f | head -20
          for f in $(find logs -type f -name '*docker.log' | sort -r | head -4); do
            echo "=== $f"
            grep -n -A 14 "Unexpected action error" "$f" | cut -c1-400 | tail -80
          done